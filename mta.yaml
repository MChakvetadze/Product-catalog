_schema-version: 3.3.0
ID: Product_Catalog-1791380689715
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Product_Catalog-1791380689715-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Product_Catalog-1791380689715-auth
      - name: Product_Catalog-1791380689715-db
      - name: Product_Catalog-1791380689715-destination

  - name: Product_Catalog-1791380689715-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Product_Catalog-1791380689715-db

  - name: Product_Catalog-1791380689715-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Product_Catalog1791380689715productcatalog
          artifacts:
            - product-catalog.zip
          target-path: app/
    requires:
      - name: Product_Catalog-1791380689715-auth
      - name: srv-api
      - name: Product_Catalog-1791380689715-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: Product_Catalog1791380689715productcatalog
    type: html5
    path: app/product-catalog
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: Product_Catalog-1791380689715-destinations
    type: com.sap.application.content
    requires:
      - name: Product_Catalog-1791380689715-auth
        parameters:
          service-key:
            name: Product_Catalog-1791380689715-auth-key
      - name: Product_Catalog-1791380689715-html5-repo-host
        parameters:
          service-key:
            name: Product_Catalog-1791380689715-html5-repo-host-key
      - name: srv-api
      - name: Product_Catalog-1791380689715-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: Product_Catalog-1791380689715-html5-repository
              ServiceInstanceName: Product_Catalog-1791380689715-html5-repo-host
              ServiceKeyName: Product_Catalog-1791380689715-html5-repo-host-key
              sap.cloud.service: Product_Catalog1791380689715.service
            - Name: Product_Catalog-1791380689715-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Product_Catalog-1791380689715-auth
              ServiceKeyName: Product_Catalog-1791380689715-auth-key
              sap.cloud.service: Product_Catalog1791380689715.service

resources:
  - name: Product_Catalog-1791380689715-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Product_Catalog-1791380689715-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'support (Product_Catalog-1791380689715 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.support'
          - name: 'admin (Product_Catalog-1791380689715 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
  - name: Product_Catalog-1791380689715-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Product_Catalog-1791380689715-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: Product_Catalog-1791380689715-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
